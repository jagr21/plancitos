<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plancitos para el fin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script async src="https://www.tiktok.com/embed.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fafafa; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); }
        .reel-container { scroll-snap-type: y mandatory; height: 70vh; overflow-y: scroll; border-radius: 24px; }
        .reel-item { scroll-snap-align: start; height: 70vh; margin-bottom: 20px; }
        .drawer-content { transition: transform 0.3s ease-out; }
        .modal-overlay { background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(4px); }
        .font-serif-aesthetic { font-family: 'Playfair Display', serif; }
        i[data-lucide] { display: inline-block; vertical-align: middle; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        // Configuración de Supabase
        const SUPABASE_URL = "https://qkurikufvzpfwdpgkpha.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrdXJpa3VmdnpwZndkcGdrcGhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNTIyMjYsImV4cCI6MjA5NDYyODIyNn0.vypgTpHH_YK2G2NBopMNJXYGMLrz9OLBGX1WEsdlwvY";
        const UNSPLASH_ACCESS_KEY = "idRz70Y1LxJIhatA2pFzBNWYvuv6O9L5q_RkR3RWor8";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const TIKTOK_SEARCHES = ["planes lechería", "comer en lechería", "playas mochima", "nuevo local lechería"];

        function App() {
            const [plans, setPlans] = useState([]);
            const [savedIds, setSavedIds] = useState([]);

            const savedPlans = useMemo(() => {
                if (!Array.isArray(plans) || !Array.isArray(savedIds)) return [];
                return plans.filter(p => savedIds.includes(p.id));
            }, [plans, savedIds]);

            const [filter, setFilter] = useState('Todos');
            const [view, setView] = useState('explore'); 
            const [selectedPlan, setSelectedPlan] = useState(null);
            const [formPlan, setFormPlan] = useState(null); // null = cerrado, {} = nuevo, {id...} = editando
            const [user, setUser] = useState(null);
            const [authMode, setAuthMode] = useState('login'); // 'login' o 'signup'
            const [authMessage, setAuthMessage] = useState(null); // { type: 'success'|'error', text: string }
            const [showUserMenu, setShowUserMenu] = useState(false);
            const [showDeleteConfirm, setShowDeleteConfirm] = useState(false);
            const [unsplashResults, setUnsplashResults] = useState([]);
            const [searchQuery, setSearchQuery] = useState('');

            // Cargar datos desde Supabase
            const fetchPlans = async () => {
                if (!user) return;
                const { data, error } = await supabaseClient
                    .from('planes')
                    .select('*')
                    .eq('user_id', user.id)
                    .order('created_at', { ascending: false });
                
                if (data) {
                    // Mapeamos los nombres de Supabase a los nombres que ya usa tu UI
                    const mappedPlans = data.map(p => ({
                        id: p.id,
                        title: p.nombre,
                        description: p.descripción,
                        location: p.ubicación,
                        instagram: p.instagram,
                        budget: p.presupuesto,
                        logisticsDetail: p.detalles || '',
                        budgetDetail: p.presupuesto_desglose || '',
                        category: p.categoria,
                        img: p.imagen_url,
                        logistics: p.logística,
                        tips: (Array.isArray(p.tips) ? p.tips : (typeof p.tips === 'string' ? p.tips.split(',') : [])).map(t => t.trim()).filter(t => t && t !== '[]'),
                        price: p.presupuesto?.includes('$') ? p.presupuesto.split('-')[0].trim() : p.presupuesto, // Fallback simple para el label de precio
                        tiktokId: p.tiktok_id // Asumiendo que podrías añadir este campo luego o guardarlo en otro lado
                    }));
                    setPlans(mappedPlans);
                    return data;
                }
                return [];
            };

            // Listener de Autenticación
            useEffect(() => {
                supabaseClient.auth.getSession().then(({ data: { session } }) => {
                    setUser(session?.user ?? null);
                });

                const { data: { subscription } } = supabaseClient.auth.onAuthStateChange((_event, session) => {
                    setUser(session?.user ?? null);
                });

                return () => subscription.unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                
                const checkAndSeed = async () => {
                    console.log("Verificando planes del usuario...");
                    const data = await fetchPlans();
                    const hasSeeded = localStorage.getItem(`seeded_${user.id}`);
                    
                    if ((!data || data.length === 0) && !hasSeeded) {
                        console.log("Cuenta vacía detectada, iniciando carga de bienvenida...");
                        await seedDatabase();
                    }
                };
                checkAndSeed();

                // Suscripción en tiempo real
                const channel = supabaseClient
                    .channel('schema-db-changes')
                    .on('postgres_changes', 
                        { event: '*', schema: 'public', table: 'planes', filter: `user_id=eq.${user.id}` }, 
                        (payload) => {
                            console.log('Cambio detectado en DB:', payload);
                            fetchPlans();
                        }
                    )
                    .subscribe();

                return () => supabaseClient.removeChannel(channel);
            }, [user]);

            // Sincronización de Iconos Lucide
            useEffect(() => {
                const timer = setTimeout(() => {
                    if (window.lucide) lucide.createIcons();
                }, 0);
                return () => clearTimeout(timer);
            }, [plans, view, selectedPlan, formPlan, user, authMessage, showUserMenu, showDeleteConfirm, swipeY]);

            // Desactivar Pull-to-Refresh cuando los modales están abiertos
            useEffect(() => {
                if (selectedPlan || formPlan) {
                    document.body.style.overscrollBehaviorY = 'contain';
                    document.body.style.overflow = 'hidden';
                } else {
                    document.body.style.overscrollBehaviorY = 'auto';
                    document.body.style.overflow = 'auto';
                }
                return () => { 
                    document.body.style.overscrollBehaviorY = 'auto';
                    document.body.style.overflow = 'auto';
                };
            }, [!!selectedPlan, !!formPlan]);

            // Manejo de navegación "atrás" y gestos swipe
            const [swipeY, setSwipeY] = useState(0);
            const [isDragging, setIsDragging] = useState(false);
            const [touchStartY, setTouchStartY] = useState(0);

            useEffect(() => {
                const handlePopState = () => {
                    setSelectedPlan(null);
                    setFormPlan(null);
                };
                window.addEventListener('popstate', handlePopState);
                return () => window.removeEventListener('popstate', handlePopState);
            }, []);

            useEffect(() => {
                if (selectedPlan || formPlan) {
                    window.history.pushState({ modal: true }, '');
                }
            }, [!!selectedPlan, !!formPlan]);

            // Persistencia de favoritos en LocalStorage vinculada al usuario
            useEffect(() => {
                if (user) {
                    const stored = localStorage.getItem(`fav_ids_${user.id}`);
                    if (stored) {
                        try {
                            const parsed = JSON.parse(stored);
                            if (Array.isArray(parsed)) setSavedIds(parsed);
                        } catch (e) {
                            console.error("Error cargando favoritos", e);
                            setSavedIds([]);
                        }
                    }
                } else {
                    setSavedIds([]);
                }
            }, [user]);

            useEffect(() => {
                if (user) {
                    localStorage.setItem(`fav_ids_${user.id}`, JSON.stringify(savedIds));
                }
            }, [savedIds, user]);

            useEffect(() => {
                if (authMessage) {
                    const timer = setTimeout(() => setAuthMessage(null), 5000);
                    return () => clearTimeout(timer);
                }
            }, [authMessage]);

            // Buscador automático de Unsplash
            useEffect(() => {
                if (!searchQuery || searchQuery.length < 3) {
                    setUnsplashResults([]);
                    return;
                }

                const timer = setTimeout(async () => {
                    try {
                        const response = await fetch(`https://api.unsplash.com/search/photos?query=${encodeURIComponent(searchQuery)}&per_page=6&client_id=${UNSPLASH_ACCESS_KEY}`);
                        const data = await response.json();
                        if (data.results) {
                            setUnsplashResults(data.results);
                        }
                    } catch (error) {
                        console.error("Error en búsqueda de Unsplash:", error);
                    }
                }, 500);

                return () => clearTimeout(timer);
            }, [searchQuery]);

            // Limpiar búsqueda al cerrar formulario
            useEffect(() => {
                if (!formPlan) {
                    setSearchQuery('');
                    setUnsplashResults([]);
                }
            }, [formPlan]);

            // Lógica para cargar videos de TikTok dinámicamente
            useEffect(() => {
                if (view === 'inspiration') {
                    // Al cambiar a "Inspiración", re-inyectamos el script de TikTok 
                    // para que escanee el nuevo contenido del DOM y renderice los embeds.
                    const script = document.createElement('script');
                    script.src = "https://www.tiktok.com/embed.js";
                    script.async = true;
                    document.body.appendChild(script);
                    
                    return () => {
                        if (document.body.contains(script)) {
                            document.body.removeChild(script);
                        }
                    };
                }
            }, [view]);

            const CATEGORIES = ['Outdoor', 'Aventura', 'Gastronomía', 'Deportes', 'Otro'];
            const PRICES = ['Gratis', '$', '$$', '$$$'];

            const getFallbackImg = (category) => {
                const terms = { Outdoor: 'nature', Aventura: 'ocean', Gastronomía: 'restaurant', Deportes: 'fitness', Otro: 'travel' };
                return `https://images.unsplash.com/photo-1500333917452-fa330087ed89?auto=format&fit=crop&q=80&w=400&sig=${Math.random()}&${terms[category] || 'travel'}`;
            };

            const filteredPlans = useMemo(() => {
                if (filter === 'Todos') return plans;
                return plans.filter(p => p.category === filter);
            }, [filter, plans]);

            const isSaved = (id) => Array.isArray(savedIds) && savedIds.includes(id);

            // Componente de Corazón SVG para evitar conflictos con Lucide
            const HeartSVG = ({ filled, className }) => (
                <svg 
                    viewBox="0 0 24 24" fill={filled ? "currentColor" : "none"} 
                    stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" 
                    className={className}
                >
                    <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
                </svg>
            );

            const toggleSave = (plan) => {
                setSavedIds(prev => {
                    const safePrev = Array.isArray(prev) ? prev : [];
                    return safePrev.includes(plan.id) 
                        ? safePrev.filter(id => id !== plan.id) 
                        : [...safePrev, plan.id];
                });
            };

            const optimizeImgUrl = (url) => {
                if (!url) return '';
                // Si es un link de Unsplash, forzamos parámetros de ligereza (800px de ancho, 60% calidad)
                if (url.includes('unsplash.com')) {
                    const baseUrl = url.split('?')[0];
                    return `${baseUrl}?auto=format&fit=crop&q=60&w=800`;
                }
                return url;
            };

            const savePlan = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const planData = Object.fromEntries(formData.entries());
                
                const formattedBudget = planData.budget ? planData.budget.replace(/\$?\s*(\d+)/g, '$$$1') : '';

                const supabasePayload = {
                    nombre: planData.title,
                    descripción: planData.description,
                    ubicación: planData.location,
                    instagram: planData.instagram ? planData.instagram.replace('@', '') : '',
                    presupuesto: formattedBudget,
                    detalles: planData.logisticsDetail,
                    categoria: planData.category,
                    imagen_url: optimizeImgUrl(planData.imgUrl || formPlan.img || getFallbackImg(planData.category)),
                    logística: planData.logistics,
                    tips: planData.tips ? planData.tips.split(',').map(t => t.trim()).filter(Boolean) : [],
                    tiktok_id: planData.tiktokId || null,
                    user_id: user.id
                };

                if (formPlan.id) {
                    await supabaseClient.from('planes').update(supabasePayload).eq('id', formPlan.id);
                } else {
                    await supabaseClient.from('planes').insert([supabasePayload]);
                }
                
                // Forzamos la actualización de la lista
                await fetchPlans();

                setFormPlan(null);
                setSelectedPlan(null);
            };

            const handleAuth = async (e) => {
                e.preventDefault();
                const { email, password } = Object.fromEntries(new FormData(e.target).entries());
                if (authMode === 'login') {
                    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
                    if (error) setAuthMessage({ type: 'error', text: "Error: Credenciales incorrectas" });
                } else {
                    const { error } = await supabaseClient.auth.signUp({ email, password });
                    if (error) setAuthMessage({ type: 'error', text: error.message });
                    else setAuthMessage({ type: 'success', text: "¡Cuenta creada! Revisa tu correo para confirmar." });
                }
            };

            const surpriseMe = () => {
                const randomPlan = plans[Math.floor(Math.random() * plans.length)];
                setSelectedPlan(randomPlan);
            };

            const deletePlan = async () => {
                if (!formPlan?.id) return;
                
                const { error } = await supabaseClient
                    .from('planes')
                    .delete()
                    .eq('id', formPlan.id)
                    .eq('user_id', user.id); // Seguridad extra: solo borrar si es mío

                if (error) {
                    setAuthMessage({ type: 'error', text: "Error al eliminar el plancito" });
                } else {
                    // Forzamos la actualización de la lista
                    await fetchPlans();
                    setFormPlan(null);
                    setSelectedPlan(null);
                    setShowDeleteConfirm(false);
                }
            };

            const seedDatabase = async () => {
                console.log("Buscando planes maestros (user_id IS NULL)...");
                const { data: templates, error: fetchError } = await supabaseClient
                    .from('planes')
                    .select('*')
                    .is('user_id', null);
                
                if (fetchError) {
                    console.error("Error al buscar plantillas:", fetchError);
                    return;
                }

                if (!templates || templates.length === 0) {
                    console.warn("No se encontraron planes maestros en la DB. Asegúrate de que user_id sea NULL.");
                    return;
                }

                console.log(`Clonando ${templates.length} planes maestros para el usuario ${user.id}...`);

                const newPlans = templates.map(({ id, created_at, ...rest }) => ({
                    ...rest,
                    user_id: user.id
                }));

                const { error: insertError } = await supabaseClient.from('planes').insert(newPlans);
                if (!insertError) {
                    console.log("¡Plancitos de prueba cargados con éxito!");
                    localStorage.setItem(`seeded_${user.id}`, 'true');
                    await fetchPlans();
                } else {
                    console.error("Error al insertar planes clonados:", insertError);
                }
            };

            if (!user) {
                return (
                    <div className="max-w-md mx-auto min-h-screen flex items-center justify-center p-8 bg-white shadow-2xl">
                        {authMessage && (
                            <div className={`fixed top-10 left-1/2 -translate-x-1/2 z-[200] w-[80%] max-w-[320px] px-6 py-4 rounded-3xl shadow-2xl flex items-center gap-3 transition-all border animate-in fade-in slide-in-from-top-4 duration-300 ${authMessage.type === 'error' ? 'bg-red-50 border-red-100 text-red-600' : 'bg-green-50 border-green-100 text-green-600'}`}>
                                <i data-lucide={authMessage.type === 'error' ? 'alert-circle' : 'check-circle'} className="w-5 h-5 flex-shrink-0"></i>
                                <p className="text-[11px] font-bold leading-tight">{authMessage.text}</p>
                            </div>
                        )}
                        <div className="w-full space-y-8">
                            <div className="text-center">
                                <h1 className="text-5xl font-black tracking-tighter text-slate-900 mb-2">Plancitos🌴</h1>
                                <p className="text-xl text-blue-500 font-serif-aesthetic italic">toda tu agenda en un solo lugar</p>
                            </div>
                            <form onSubmit={handleAuth} className="space-y-4 pt-8">
                                <div className="space-y-1">
                                    <label className="text-[10px] font-black uppercase text-slate-400 px-1">Email</label>
                                    <input name="email" type="email" required className="w-full bg-slate-50 border-none rounded-2xl p-4 text-sm outline-none focus:ring-2 ring-blue-500/10" placeholder="tu@correo.com" />
                                </div>
                                <div className="space-y-1">
                                    <label className="text-[10px] font-black uppercase text-slate-400 px-1">Contraseña</label>
                                    <input name="password" type="password" required className="w-full bg-slate-50 border-none rounded-2xl p-4 text-sm outline-none focus:ring-2 ring-blue-500/10" placeholder="••••••••" />
                                </div>
                                <button type="submit" className="w-full py-4 bg-slate-900 text-white rounded-2xl font-bold text-sm shadow-xl active:scale-95 transition-all mt-4">
                                    {authMode === 'login' ? 'Iniciar Sesión' : 'Registrarse'}
                                </button>
                            </form>
                            <div className="text-center">
                                <button onClick={() => setAuthMode(authMode === 'login' ? 'signup' : 'login')} className="text-xs text-slate-400 font-semibold hover:text-blue-500 transition-colors underline underline-offset-4">
                                    {authMode === 'login' ? '¿No tienes cuenta? Regístrate gratis' : '¿Ya tienes cuenta? Inicia sesión'}
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-md mx-auto min-h-screen pb-24 relative bg-white shadow-2xl">
                    {/* Header */}
                    <header className="p-7 sticky top-0 z-50 glass border-b border-slate-50">
                        <div className="flex justify-between items-center mb-7">
                            <div>
                                <div className="flex items-center gap-2">
                                    <h1 className="text-4xl font-black tracking-tighter text-slate-900 leading-none">Plancitos</h1>
                                    <span className="text-3xl">🌴</span>
                                </div>
                                <p className="text-2xl text-blue-500 font-serif-aesthetic italic lowercase leading-none mt-1">{view === 'saved' ? 'mis guardados' : 'para el fin'}</p>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => setView('saved')} className="relative p-2 bg-slate-50 rounded-full cursor-pointer active:scale-90 transition-all border-none outline-none">
                                    <HeartSVG filled={savedPlans.length > 0} className={`w-5 h-5 ${savedPlans.length > 0 ? 'text-red-500' : 'text-slate-400'}`} />
                                    {savedPlans.length > 0 && (
                                        <span className="absolute -top-1 -right-1 bg-red-500 text-white text-[9px] w-4 h-4 rounded-full flex items-center justify-center font-bold">
                                            {savedPlans.length}
                                        </span>
                                    )}
                                </button>
                                <div className="relative">
                                    <button onClick={() => setShowUserMenu(!showUserMenu)} className="relative p-2 bg-slate-50 rounded-full cursor-pointer active:scale-90 transition-all border-none outline-none text-slate-400">
                                        <i data-lucide="user" className="w-5 h-5 transition-colors"></i>
                                    </button>
                                    {showUserMenu && (
                                        <>
                                            <div className="fixed inset-0 z-[55]" onClick={() => setShowUserMenu(false)}></div>
                                            <div className="absolute right-0 mt-3 w-56 bg-white rounded-[24px] shadow-2xl border border-slate-50 p-5 z-[60] animate-in fade-in zoom-in-95 duration-200">
                                                <p className="text-[9px] font-black uppercase tracking-widest text-slate-400 mb-1">Tu Cuenta</p>
                                                <p className="text-xs font-bold text-slate-800 mb-4 truncate">{user.email}</p>
                                                <div className="h-px bg-slate-50 mb-4"></div>
                                                <button onClick={() => supabaseClient.auth.signOut()} className="flex items-center gap-2 text-red-500 text-xs font-bold hover:opacity-70 transition-opacity">
                                                    <i data-lucide="log-out" className="w-4 h-4"></i> Cerrar Sesión
                                                </button>
                                            </div>
                                        </>
                                    )}
                                </div>
                            </div>
                        </div>
                        
                        <div className="flex gap-6 mb-2">
                            <button onClick={() => setView('explore')} className={`pb-2 text-sm font-semibold transition-all ${view === 'explore' ? 'border-b-2 border-blue-500 text-blue-600' : 'text-slate-400'}`}>Explorar</button>
                            <button onClick={() => setView('inspiration')} className={`pb-2 text-sm font-semibold transition-all ${view === 'inspiration' ? 'border-b-2 border-blue-500 text-blue-600' : 'text-slate-400'}`}>Inspiración</button>
                            {view === 'saved' && <button className="pb-2 text-sm font-semibold border-b-2 border-red-500 text-red-600">Guardados</button>}
                        </div>

                        {view === 'explore' && (
                            <div className="flex gap-2 overflow-x-auto no-scrollbar py-2">
                                {['Todos', 'Outdoor', 'Aventura', 'Gastronomía', 'Deportes', 'Otro'].map(cat => (
                                    <button 
                                        key={cat}
                                        onClick={() => setFilter(cat)}
                                        className={`px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all ${filter === cat ? 'bg-slate-900 text-white shadow-lg shadow-slate-200' : 'bg-slate-100 text-slate-500'}`}
                                    >
                                        {cat}
                                    </button>
                                ))}
                            </div>
                        )}
                    </header>

                    <main className="px-6 pt-4">
                        {plans.length === 0 && view === 'explore' && (
                            <div className="flex flex-col items-center justify-center py-20 text-center">
                                <div className="bg-blue-50 p-6 rounded-[32px] mb-4">
                                    <i data-lucide="database" className="w-12 h-12 text-blue-500 opacity-50"></i>
                                </div>
                                <h3 className="font-bold text-slate-800 mb-2">¡No tienes plancitos!</h3>
                                <p className="text-xs text-slate-500 mb-6 px-10">Para ver algo, agrega un nuevo plan</p>
                                <button onClick={() => setFormPlan({})} className="bg-slate-900 text-white px-6 py-3 rounded-2xl text-xs font-bold shadow-lg active:scale-95 transition-all">Cargar nuevo plancito</button>
                            </div>
                        )}
                        {view === 'explore' || view === 'saved' ? (
                            <div className="grid grid-cols-1 gap-8">
                                {(view === 'explore' ? filteredPlans : savedPlans).map(plan => (
                                    <div 
                                        key={plan.id} 
                                        onClick={() => setSelectedPlan(plan)}
                                        className="group rounded-[32px] overflow-hidden bg-white border border-slate-100 shadow-sm transition-all active:scale-[0.98] cursor-pointer"
                                    >
                                        <div className="relative h-56 overflow-hidden">
                                            <img src={plan.img} alt={plan.title} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" />
                                            <div className="absolute top-4 left-4 bg-white/80 backdrop-blur-md px-3 py-1.5 rounded-2xl text-[10px] font-bold text-slate-800 shadow-sm uppercase tracking-tight">
                                                {plan.category}
                                            </div>
                                        </div>
                                        <div className="p-5">
                                            <div className="flex justify-between items-start mb-3">
                                                <h3 className="font-bold text-xl text-slate-800 tracking-tight">{plan.title}</h3>
                                                <span className="bg-blue-50 text-blue-600 px-2 py-1 rounded-lg font-bold text-xs">{plan.price}</span>
                                            </div>
                                    <div className="flex flex-col gap-2 text-slate-500 text-xs mb-4">
                                                <div className="flex items-center gap-2"><i data-lucide="ship" className="w-3.5 h-3.5 text-blue-400"></i> {plan.logistics}</div>
                                                <div className="flex items-center gap-2"><i data-lucide="dollar-sign" className="w-3.5 h-3.5 text-green-400"></i> Presupuesto: {plan.budget}</div>
                                                {plan.instagram && (
                                                    <div className="flex items-center gap-2"><i data-lucide="at-sign" className="w-3.5 h-3.5 text-pink-400"></i> @{plan.instagram}</div>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                ))}
                                {view === 'saved' && savedPlans.length === 0 && (
                                    <div className="flex flex-col items-center justify-center py-20 text-slate-400 text-center">
                                        <i data-lucide="heart" className="w-12 h-12 mb-4 opacity-20"></i>
                                        <p className="text-sm font-medium">No tienes planes guardados aún.</p>
                                        <button onClick={() => setView('explore')} className="mt-4 text-blue-500 text-xs font-bold underline">Explorar planes</button>
                                    </div>
                                )}
                            </div>
                        ) : (
                            /* Reel-style feed */
                            <div className="reel-container no-scrollbar">
                                <div className="mb-8 flex gap-2 overflow-x-auto no-scrollbar sticky top-0 z-10 py-2 glass">
                                    {TIKTOK_SEARCHES.map(tag => (
                                        <span key={tag} className="bg-white/50 border border-slate-100 backdrop-blur-sm text-[10px] font-bold px-4 py-2 rounded-full whitespace-nowrap text-slate-600 shadow-sm">
                                            #{tag.replace(/\s/g, '')}
                                        </span>
                                    ))}
                                </div>

                                {plans.map(plan => (
                                    <div key={plan.id} className="reel-item relative w-full bg-white flex flex-col items-center justify-start overflow-hidden rounded-[32px] border border-slate-100 shadow-lg">
                                        <div className="w-full h-full overflow-y-auto no-scrollbar pt-4 px-2">
                                            <blockquote 
                                                className="tiktok-embed" 
                                                cite={`https://www.tiktok.com/video/${plan.tiktokId}`} 
                                                data-video-id={plan.tiktokId}
                                                style={{ maxWidth: '605px', minWidth: '325px' }}
                                            > 
                                                <section> 
                                                    <a target="_blank" title={`@plancitos`} href={`https://www.tiktok.com/video/${plan.tiktokId}`}>Cargando video de inspiración...</a> 
                                                </section> 
                                            </blockquote>
                                        </div>
                                        <div className="absolute top-6 right-6 z-20 flex flex-col gap-4">
                                            <div onClick={() => toggleSave(plan)} className="p-3 bg-white/90 backdrop-blur rounded-full shadow-lg cursor-pointer active:scale-90 transition-all">
                                                <HeartSVG filled={isSaved(plan.id)} className={`w-6 h-6 ${isSaved(plan.id) ? 'text-red-500' : 'text-slate-400'}`} />
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>

                    {/* Modal Formulario (Nuevo / Editar) */}
                    {formPlan && (
                        <div className="fixed inset-0 z-[110] flex items-end justify-center">
                            <div className="modal-overlay absolute inset-0" onClick={() => setFormPlan(null)}></div>
                            <form 
                                onSubmit={savePlan} 
                                onTouchStart={(e) => { setTouchStartY(e.touches[0].clientY); setIsDragging(true); }}
                                onTouchMove={(e) => {
                                    if (!isDragging) return;
                                    const diff = e.touches[0].clientY - touchStartY;
                                    if (diff > 0) setSwipeY(diff);
                                }}
                                onTouchEnd={(e) => {
                                    setIsDragging(false);
                                    if (swipeY > 100) setFormPlan(null);
                                    setSwipeY(0);
                                }}
                                style={{ transform: `translateY(${swipeY}px)`, transition: isDragging ? 'none' : 'transform 0.5s cubic-bezier(0.32, 0.72, 0, 1)' }}
                                className="drawer-content relative w-full max-w-md bg-white rounded-t-[40px] p-8 pb-12 shadow-2xl max-h-[95vh] overflow-y-auto"
                            >
                                <div className="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-6"></div>
                                <button type="button" onClick={() => setFormPlan(null)} className="absolute top-6 right-6 p-2 text-slate-300 hover:text-slate-500 active:scale-90 transition-all">
                                    <i data-lucide="x" className="w-6 h-6"></i>
                                </button>
                                <h2 className="text-2xl font-bold mb-6 text-slate-900">{formPlan.id ? 'Editar Plan' : 'Nuevo Plancito'}</h2>
                                
                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">Título del Plan</label>
                                        <input name="title" defaultValue={formPlan.title} required className="w-full bg-slate-50 border-none rounded-xl p-3 text-sm" placeholder="Ej: Picnic en la playa" />
                                    </div>
                                    
                                    <div>
                                        <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">Imagen del Plancito</label>
                                        <div className="space-y-3">
                                            <div className="relative">
                                                <input 
                                                    value={searchQuery}
                                                    onChange={(e) => setSearchQuery(e.target.value)}
                                                    className="w-full bg-slate-100 border-none rounded-xl p-3 text-xs focus:ring-2 ring-blue-500/20 outline-none pr-10" 
                                                    placeholder="Busca una foto (ej: playa, sushi...)" 
                                                />
                                                <i data-lucide="search" className="w-4 h-4 text-slate-400 absolute right-3 top-3"></i>
                                            </div>
                                            
                                            {unsplashResults.length > 0 && (
                                                <div className="grid grid-cols-3 gap-2 animate-in fade-in slide-in-from-top-2 duration-300">
                                                    {unsplashResults.map(photo => (
                                                        <div 
                                                            key={photo.id}
                                                            onClick={() => setFormPlan({...formPlan, img: photo.urls.regular})}
                                                            className={`relative aspect-square rounded-lg overflow-hidden cursor-pointer transition-all ${formPlan.img === photo.urls.regular ? 'ring-4 ring-blue-500 ring-offset-2' : 'hover:opacity-80'}`}
                                                        >
                                                            <img src={photo.urls.thumb} className="w-full h-full object-cover" />
                                                            {formPlan.img === photo.urls.regular && (
                                                                <div className="absolute inset-0 bg-blue-500/20 flex items-center justify-center">
                                                                    <i data-lucide="check" className="w-6 h-6 text-white drop-shadow-md"></i>
                                                                </div>
                                                            )}
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                            <input name="imgUrl" type="hidden" value={formPlan.img || ''} />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">Usuario Instagram (sin @)</label>
                                        <div className="flex items-center gap-2 bg-slate-50 rounded-xl px-4 border border-transparent focus-within:border-pink-100 transition-all">
                                            <i data-lucide="at-sign" className="w-4 h-4 text-pink-500"></i>
                                            <input name="instagram" defaultValue={formPlan.instagram} className="w-full bg-transparent border-none py-3 text-sm focus:ring-0 outline-none" placeholder="Ej: lecheria" />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">Categoría</label>
                                            <select name="category" defaultValue={formPlan.category || 'Outdoor'} className="w-full bg-slate-50 border-none rounded-xl p-3 text-sm">
                                                {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">Precio</label>
                                            <select name="price" defaultValue={formPlan.price || 'Gratis'} className="w-full bg-slate-50 border-none rounded-xl p-3 text-sm">
                                                {PRICES.map(p => <option key={p} value={p}>{p}</option>)}
                                            </select>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">Ubicación</label>
                                        <input name="location" defaultValue={formPlan.location} required className="w-full bg-slate-50 border-none rounded-xl p-3 text-sm" placeholder="Nombre del sitio" />
                                    </div>

                                    <div>
                                        <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">Descripción</label>
                                        <textarea name="description" defaultValue={formPlan.description} className="w-full bg-slate-50 border-none rounded-xl p-3 text-sm h-20" placeholder="¿De qué trata?"></textarea>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">Logística corta</label>
                                            <input name="logistics" defaultValue={formPlan.logistics} className="w-full bg-slate-50 border-none rounded-xl p-3 text-sm" placeholder="Ej: Fácil acceso" />
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">Presupuesto</label>
                                            <input name="budget" defaultValue={formPlan.budget} className="w-full bg-slate-50 border-none rounded-xl p-3 text-sm" placeholder="Ej: 10 - 20" />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">Logística Detallada</label>
                                        <textarea name="logisticsDetail" defaultValue={formPlan.logisticsDetail} className="w-full bg-slate-50 border-none rounded-xl p-3 text-sm h-16" placeholder="¿Cómo se llega exactamente?"></textarea>
                                    </div>

                                    <div>
                                        <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">Desglose de Presupuesto</label>
                                        <input name="budgetDetail" defaultValue={formPlan.budgetDetail} className="w-full bg-slate-50 border-none rounded-xl p-3 text-sm" placeholder="Ej: Entrada $5, Comida $10" />
                                    </div>

                                    <div>
                                        <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">Tips Pro (separados por coma)</label>
                                        <input name="tips" defaultValue={formPlan.tips?.join(', ')} className="w-full bg-slate-50 border-none rounded-xl p-3 text-sm" placeholder="Tip 1, Tip 2, Tip 3" />
                                    </div>

                                    <div>
                                        <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">TikTok Video ID (Opcional)</label>
                                        <input name="tiktokId" defaultValue={formPlan.tiktokId} className="w-full bg-slate-50 border-none rounded-xl p-3 text-sm" placeholder="Ej: 732483864..." />
                                    </div>
                                </div>

                                <div className="flex gap-4 mt-8">
                                    {formPlan.id && (
                                        <button 
                                            type="button" 
                                            onClick={() => setShowDeleteConfirm(true)} 
                                            className="flex-1 py-4 bg-red-50 text-red-600 rounded-2xl font-bold text-sm active:scale-95 transition-all flex items-center justify-center gap-2"
                                        >
                                            <i data-lucide="trash-2" className="w-4 h-4"></i> Eliminar
                                        </button>
                                    )}
                                    <button type="submit" className={`${formPlan.id ? 'flex-[2]' : 'w-full'} py-4 bg-blue-600 text-white rounded-2xl font-bold text-sm shadow-lg shadow-blue-100`}>
                                        {formPlan.id ? 'Guardar Cambios' : 'Guardar Plancito'}
                                    </button>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* Modal Detalle Plan */}
                    {selectedPlan && (
                        <div className="fixed inset-0 z-[100] flex items-end justify-center">
                            <div className="modal-overlay absolute inset-0" onClick={() => setSelectedPlan(null)}></div>
                            <div 
                                onTouchStart={(e) => { setTouchStartY(e.touches[0].clientY); setIsDragging(true); }}
                                onTouchMove={(e) => {
                                    if (!isDragging) return;
                                    const diff = e.touches[0].clientY - touchStartY;
                                    if (diff > 0) setSwipeY(diff);
                                }}
                                onTouchEnd={(e) => {
                                    setIsDragging(false);
                                    if (swipeY > 100) setSelectedPlan(null);
                                    setSwipeY(0);
                                }}
                                style={{ transform: `translateY(${swipeY}px)`, transition: isDragging ? 'none' : 'transform 0.5s cubic-bezier(0.32, 0.72, 0, 1)' }}
                                className="drawer-content relative w-full max-w-md bg-white rounded-t-[40px] shadow-2xl max-h-[92vh] overflow-y-auto no-scrollbar"
                            >
                                {/* Hero Image Section */}
                                <div className="relative h-80 w-full flex items-end">
                                    <img src={selectedPlan.img} className="absolute inset-0 w-full h-full object-cover" />
                                    <div className="absolute inset-0 bg-gradient-to-t from-white via-white/40 to-black/10"></div>
                                    <div className="w-12 h-1.5 bg-white/60 backdrop-blur rounded-full mx-auto absolute top-4 left-1/2 -translate-x-1/2"></div>
                                    
                                    <button onClick={() => setSelectedPlan(null)} className="absolute top-6 left-6 p-2 text-white/70 hover:text-white active:scale-90 transition-all z-30">
                                        <i data-lucide="x" className="w-6 h-6"></i>
                                    </button>

                                    <div className="absolute top-6 right-6 flex gap-2">
                                        <button onClick={() => setFormPlan(selectedPlan)} className="p-3 bg-white/20 backdrop-blur-xl border border-white/30 rounded-2xl text-white shadow-xl active:scale-90 transition-all">
                                            <i key="btn-edit" data-lucide="pencil" className="w-5 h-5 drop-shadow-md"></i>
                                        </button>
                                        <button onClick={() => toggleSave(selectedPlan)} className="p-3 bg-white/20 backdrop-blur-xl border border-white/30 rounded-2xl shadow-xl active:scale-90 transition-all">
                                            <HeartSVG filled={isSaved(selectedPlan.id)} className={`w-6 h-6 ${isSaved(selectedPlan.id) ? 'text-red-500' : 'text-white drop-shadow-md'}`} />
                                        </button>
                                    </div>

                                    <div className="relative p-8 w-full backdrop-blur-[2px] bg-white/10">
                                        <span className="text-[10px] font-black uppercase tracking-[0.2em] text-blue-600 mb-2 block bg-blue-50/80 backdrop-blur-md w-fit px-2 py-0.5 rounded-md">{selectedPlan.category}</span>
                                        <h2 className="text-4xl font-black text-slate-900 tracking-tighter mb-2 leading-tight">{selectedPlan.title}</h2>
                                        <p className="text-slate-700 text-sm font-medium leading-relaxed max-w-[90%]">{selectedPlan.description}</p>
                                    </div>
                                </div>

                                <div className="p-8 pt-2 space-y-6 mb-8">
                                    {selectedPlan.instagram && (
                                        <div className="flex items-start gap-4">
                                            <div className="p-2 bg-pink-50 rounded-xl"><i data-lucide="at-sign" className="w-5 h-5 text-pink-600"></i></div>
                                            <div>
                                                <p className="text-xs font-bold text-slate-900">Instagram</p>
                                                <a href={`https://instagram.com/${selectedPlan.instagram}`} target="_blank" className="text-xs text-blue-500 font-medium italic underline">@{selectedPlan.instagram}</a>
                                            </div>
                                        </div>
                                    )}
                                    <div className="flex items-start gap-4">
                                        <div className="p-2 bg-blue-50 rounded-xl"><i data-lucide="map-pin" className="w-5 h-5 text-blue-600"></i></div>
                                        <div>
                                            <p className="text-xs font-bold text-slate-900">Ubicación</p>
                                            <p className="text-xs text-slate-500">{selectedPlan.location}</p>
                                        </div>
                                    </div>
                                    <div className="flex items-start gap-4">
                                        <div className="p-2 bg-orange-50 rounded-xl"><i data-lucide="truck" className="w-5 h-5 text-orange-600"></i></div>
                                        <div>
                                            <p className="text-xs font-bold text-slate-900">Logística Detallada</p>
                                            <p className="text-xs text-slate-500">{selectedPlan.logisticsDetail}</p>
                                        </div>
                                    </div>
                                    <div className="flex items-start gap-4">
                                        <div className="p-2 bg-purple-50 rounded-xl"><i data-lucide="wallet" className="w-5 h-5 text-purple-600"></i></div>
                                        <div>
                                            <p className="text-xs font-bold text-slate-900">Desglose de Presupuesto</p>
                                            <p className="text-xs text-slate-500">{selectedPlan.budgetDetail}</p>
                                        </div>
                                    </div>
                                    <div className="flex items-start gap-4">
                                        <div className="p-2 bg-green-50 rounded-xl"><i data-lucide="sparkles" className="w-5 h-5 text-green-600"></i></div>
                                        <div>
                                            <p className="text-xs font-bold text-slate-900">Tips Pro</p>
                                            <ul className="text-xs text-slate-500 list-disc list-inside">
                                                {selectedPlan.tips.map((tip, i) => <li key={i}>{tip}</li>)}
                                            </ul>
                                        </div>
                                    </div>
                                </div>

                                <a 
                                    href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(selectedPlan.location + " Lecheria")}`}
                                    target="_blank"
                                    className="w-full py-5 bg-slate-900 text-white rounded-[24px] font-bold text-sm shadow-xl shadow-slate-200 flex items-center justify-center gap-3"
                                >
                                    <i data-lucide="map" className="w-4 h-4"></i> Cómo llegar con Google Maps
                                </a>
                            </div>
                        </div>
                    )}

                    {/* Popup Confirmación Eliminación */}
                    {showDeleteConfirm && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center p-6">
                            <div className="modal-overlay absolute inset-0" onClick={() => setShowDeleteConfirm(false)}></div>
                            <div className="bg-white rounded-[32px] p-8 w-full max-w-[320px] relative z-10 shadow-2xl animate-in zoom-in-95 duration-200 text-center">
                                <div className="bg-red-50 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-6">
                                    <i data-lucide="trash-2" className="w-8 h-8 text-red-500"></i>
                                </div>
                                <h3 className="text-xl font-bold text-slate-900 mb-2 tracking-tight">¿Eliminar plancito?</h3>
                                <p className="text-[11px] text-slate-500 mb-8 leading-relaxed px-4">Esta acción es permanente y no se podrá recuperar el plancito.</p>
                                <div className="flex flex-col gap-3">
                                    <button onClick={deletePlan} className="w-full py-4 bg-red-500 text-white rounded-2xl font-bold text-sm shadow-lg shadow-red-100 active:scale-95 transition-all">Sí, eliminar</button>
                                    <button onClick={() => setShowDeleteConfirm(false)} className="w-full py-4 bg-slate-50 text-slate-500 rounded-2xl font-bold text-sm active:scale-95 transition-all">Cancelar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Tab Bar Navegación */}
                    <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto glass border-t border-slate-100 p-4 px-6 flex justify-between items-center rounded-t-[32px]">
                        <button onClick={() => setView('explore')} className={`flex flex-col items-center gap-1.5 ${view === 'explore' ? 'text-blue-600' : 'text-slate-400'}`}>
                            <i data-lucide="filter" className="w-5 h-5"></i>
                            <span className="text-[9px] font-bold uppercase tracking-tighter">Explorar</span>
                        </button>

                        <button onClick={surpriseMe} className="flex flex-col items-center gap-1.5 text-slate-400 hover:text-purple-500 transition-colors">
                            <i data-lucide="dices" className="w-5 h-5"></i>
                            <span className="text-[9px] font-bold uppercase tracking-tighter">Sorpresa</span>
                        </button>

                        <div 
                            onClick={() => setFormPlan({})}
                            className="w-14 h-14 bg-slate-900 rounded-2xl flex items-center justify-center shadow-xl shadow-slate-300 -mt-12 border-[6px] border-white active:scale-90 transition-all cursor-pointer"
                        >
                            <i data-lucide="plus" className="w-6 h-6 text-white"></i>
                        </div>

                        <button onClick={() => setView('inspiration')} className={`flex flex-col items-center gap-1.5 ${view === 'inspiration' ? 'text-blue-600' : 'text-slate-400'}`}>
                            <i data-lucide="play" className="w-5 h-5"></i>
                            <span className="text-[9px] font-bold uppercase tracking-tighter">Inspo</span>
                        </button>

                        <button onClick={() => setView('saved')} className={`flex flex-col items-center gap-1.5 ${view === 'saved' ? 'text-blue-600' : 'text-slate-400'}`}>
                            <div className="relative">
                                <i data-lucide="bookmark" className="w-5 h-5"></i>
                                {savedPlans.length > 0 && <span key="dot-fav" className="absolute -top-1 -right-1 w-2 h-2 bg-red-500 rounded-full"></span>}
                            </div>
                            <span className="text-[9px] font-bold uppercase tracking-tighter">Guardados</span>
                        </button>
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
