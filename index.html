<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plancitos para el fin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fafafa; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); }
        .reel-container { scroll-snap-type: y mandatory; height: 100%; overflow-y: scroll; border-radius: 24px; }
        .reel-item { scroll-snap-align: start; height: 70vh; margin-bottom: 20px; }
        .drawer-content { transition: transform 0.3s ease-out; }
        .modal-overlay { background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(4px); }
        .font-serif-aesthetic { font-family: 'Playfair Display', serif; }
        i[data-lucide] { display: inline-block; vertical-align: middle; }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        .animate-fade-out {
            animation: fadeOut 0.4s ease-out forwards;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        // Configuración de Supabase
        const SUPABASE_URL = "https://qkurikufvzpfwdpgkpha.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrdXJpa3VmdnpwZndkcGdrcGhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNTIyMjYsImV4cCI6MjA5NDYyODIyNn0.vypgTpHH_YK2G2NBopMNJXYGMLrz9OLBGX1WEsdlwvY";
        const UNSPLASH_ACCESS_KEY = "idRz70Y1LxJIhatA2pFzBNWYvuv6O9L5q_RkR3RWor8";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function App() {
            const [authChecking, setAuthChecking] = useState(true);
            const [isLoadingData, setIsLoadingData] = useState(true);
            const [plans, setPlans] = useState([]);
            const [showLoadingOverlay, setShowLoadingOverlay] = useState(true); // Controla la visibilidad de la pantalla de carga
            const [isFadingOut, setIsFadingOut] = useState(false); // Controla si la pantalla de carga está desvaneciéndose
            const [userCity, setUserCity] = useState(() => localStorage.getItem('plancitos_city') || '');
            const [isNavVisible, setIsNavVisible] = useState(true);
            const [searchTerm, setSearchTerm] = useState('');
            const [isSearching, setIsSearching] = useState(false);
            const [filter, setFilter] = useState('Todos');
            const [view, setView] = useState('explore'); 
            const [selectedPlan, setSelectedPlan] = useState(null);
            const [formPlan, setFormPlan] = useState(null); 
            const [completionPlan, setCompletionPlan] = useState(null);
            const [user, setUser] = useState(null);
            const [authMode, setAuthMode] = useState('login');
            const [authMessage, setAuthMessage] = useState(null);
            const [showUserMenu, setShowUserMenu] = useState(false);
            const [showDeleteConfirm, setShowDeleteConfirm] = useState(false);
            const [showUncompleteConfirm, setShowUncompleteConfirm] = useState(false);
            const [planToUncomplete, setPlanToUncomplete] = useState(null);
            const [unsplashResults, setUnsplashResults] = useState([]);
            const [searchQuery, setSearchQuery] = useState('');
            const [rating, setRating] = useState(0);
            const [hoverRating, setHoverRating] = useState(0);

            const dragStartY = React.useRef(0);
            const isDragging = React.useRef(false);
            const lastScrollTop = React.useRef(0);
            const searchCache = React.useRef({});
            const searchRef = React.useRef(null);
            const mainRef = React.useRef(null);

            const normalize = (str) => str ? str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "") : "";

            // Memos movidos después de las declaraciones de estado
            const savedIds = useMemo(() => plans.filter(p => p.favorito).map(p => p.id), [plans]);
            const completedIds = useMemo(() => plans.filter(p => p.completado).map(p => p.id), [plans]);

            const savedPlans = useMemo(() => {
                let list = plans.filter(p => p.favorito);
                if (filter !== 'Todos') list = list.filter(p => p.category === filter);
                if (searchTerm) {
                    const q = normalize(searchTerm);
                    list = list.filter(p => 
                        normalize(p.title).includes(q) || normalize(p.description).includes(q) || 
                        normalize(p.location).includes(q) || normalize(p.category).includes(q)
                    );
                }
                return list;
            }, [plans, searchTerm, filter]);

            const completedPlans = useMemo(() => {
                let list = plans.filter(p => p.completado);
                if (filter !== 'Todos') list = list.filter(p => p.category === filter);
                if (searchTerm) {
                    const q = normalize(searchTerm);
                    list = list.filter(p => 
                        normalize(p.title).includes(q) || normalize(p.description).includes(q) || 
                        normalize(p.location).includes(q) || normalize(p.category).includes(q)
                    );
                }
                return list;
            }, [plans, searchTerm, filter]);

            // Canales de búsqueda para inspiración (Hashtags inteligentes)
            const inspirationChannels = useMemo(() => {
                if (!userCity) return [];
                // Limpiamos la ciudad para hashtags: sin acentos, sin espacios
                const cityClean = userCity.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s/g, '');
                return [
                    { title: `Planes en ${userCity}`, tag: `planes${cityClean}`, icon: 'map' },
                    { title: `Ruta Gastronómica`, tag: `comeren${cityClean}`, icon: 'utensils' },
                    { title: `Explora la ciudad`, tag: `quehaceren${cityClean}`, icon: 'compass' },
                    { title: `Viajes y Tips`, tag: `turismo${cityClean}`, icon: 'camera' }
                ];
            }, [userCity]);

            // Cargar datos desde Supabase
            const fetchPlans = async () => {
                if (!user) return;
                const { data, error } = await supabaseClient
                    .from('planes')
                    .select('*')
                    .eq('user_id', user.id)
                    .order('created_at', { ascending: false });
                
                if (data) {
                    // Mapeamos los nombres de Supabase a los nombres que ya usa tu UI
                    const mappedPlans = data.map(p => ({
                        id: p.id,
                        title: p.nombre,
                        description: p.descripción,
                        location: p.ubicación,
                        instagram: p.instagram,
                        budget: p.presupuesto,
                        logisticsDetail: p.detalles || '',
                        budgetDetail: p.presupuesto_desglose || '',
                        category: p.categoria,
                        img: p.imagen_url,
                        logistics: p.logística,
                        tips: (Array.isArray(p.tips) ? p.tips : (typeof p.tips === 'string' ? p.tips.split(',') : [])).map(t => t.trim()).filter(t => t && t !== '[]'),
                        price: p.presupuesto?.includes('$') ? p.presupuesto.split('-')[0].trim() : p.presupuesto, // Fallback simple para el label de precio
                        tiktokId: p.tiktok_id,
                        favorito: !!p.favorito,
                        completado: !!p.completado,
                        completedDate: p.fecha_completado,
                        rating: p.puntuacion,
                        completionComment: p.comentario_completado
                    }));
                    setPlans(mappedPlans);
                    return data;
                }
                return [];
            };

            // Listener de Autenticación
            useEffect(() => {
                supabaseClient.auth.getSession().then(({ data: { session } }) => {
                    setUser(session?.user ?? null);
                    setAuthChecking(false);
                });

                const { data: { subscription } } = supabaseClient.auth.onAuthStateChange((_event, session) => {
                    setUser(session?.user ?? null);
                    setAuthChecking(false);
                });

                return () => subscription.unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) {
                    setIsLoadingData(false);
                    return;
                }
                
                const checkAndSeed = async () => {
                    setIsLoadingData(true);
                    const data = await fetchPlans();
                    const hasSeeded = localStorage.getItem(`seeded_${user.id}`);
                    
                    if ((!data || data.length === 0) && !hasSeeded) {
                        await seedDatabase();
                    }
                    setIsLoadingData(false);
                };
                checkAndSeed();

                // Suscripción en tiempo real
                const channel = supabaseClient
                    .channel('schema-db-changes')
                    .on('postgres_changes', 
                        { event: '*', schema: 'public', table: 'planes', filter: `user_id=eq.${user.id}` }, 
                        (payload) => {
                            if (payload.eventType === 'UPDATE') {
                                // Actualización inteligente: solo cambiamos el plan afectado sin recargar todo
                                const updated = payload.new;
                                setPlans(prev => prev.map(p => p.id === updated.id ? { 
                                    ...p, 
                                    favorito: !!updated.favorito, 
                                    completado: !!updated.completado 
                                } : p));
                            } else if (payload.eventType === 'INSERT' || payload.eventType === 'DELETE') {
                                // Para nuevos planes o borrados, sí necesitamos refrescar la lista completa
                                fetchPlans();
                            }
                        }
                    )
                    .subscribe();

                return () => supabaseClient.removeChannel(channel);
            }, [user]);

            // Sincronización de Iconos Lucide
            useEffect(() => {
                if (!window.lucide) return;
                const timer = setTimeout(() => {
                    try {
                        if (window.lucide) lucide.createIcons();
                    } catch (e) {
                        console.warn("Lucide icons not ready");
                    }
                }, 0);
                return () => clearTimeout(timer);
            }, [plans, view, selectedPlan, formPlan, completionPlan, user, authMessage, showUserMenu, showDeleteConfirm, showUncompleteConfirm, showLoadingOverlay, isLoadingData, completedIds, userCity, isSearching, searchTerm]);

            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (isSearching && searchRef.current && !searchRef.current.contains(event.target)) {
                        setIsSearching(false);
                        setSearchTerm('');
                    }
                };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, [isSearching]);

            // Desactivar Pull-to-Refresh cuando los modales están abiertos
            useEffect(() => {
                if (selectedPlan || formPlan || completionPlan || showUncompleteConfirm || showDeleteConfirm) {
                    document.body.style.overscrollBehaviorY = 'contain';
                    document.body.style.overflow = 'hidden';
                } else {
                    document.body.style.overscrollBehaviorY = 'auto';
                    document.body.style.overflow = 'auto';
                }
                return () => { 
                    document.body.style.overscrollBehaviorY = 'auto';
                    document.body.style.overflow = 'auto';
                };
            }, [!!selectedPlan, !!formPlan, !!completionPlan, showUncompleteConfirm, showDeleteConfirm]);

            useEffect(() => {
                const handlePopState = () => {
                    setSelectedPlan(null);
                    setFormPlan(null);
                    setCompletionPlan(null);
                    setShowUncompleteConfirm(false);
                };
                window.addEventListener('popstate', handlePopState);
                return () => window.removeEventListener('popstate', handlePopState);
            }, []);

            useEffect(() => {
                if (selectedPlan || formPlan || completionPlan || showUncompleteConfirm || showDeleteConfirm) {
                    window.history.pushState({ modal: true }, '');
                }
            }, [!!selectedPlan, !!formPlan, !!completionPlan, showUncompleteConfirm, showDeleteConfirm]);

            useEffect(() => {
                if (authMessage) {
                    const timer = setTimeout(() => setAuthMessage(null), 2000);
                    return () => clearTimeout(timer);
                }
            }, [authMessage]);

            // Buscador automático de Unsplash
            useEffect(() => {
                const query = searchQuery?.trim().toLowerCase();
                if (!query || query.length < 3) {
                    setUnsplashResults([]);
                    return;
                }

                // Si ya lo buscamos antes, mostramos resultados instantáneamente desde el cache
                if (searchCache.current[query]) {
                    setUnsplashResults(searchCache.current[query]);
                    return;
                }

                const timer = setTimeout(async () => {
                    try {
                        const response = await fetch(`https://api.unsplash.com/search/photos?query=${encodeURIComponent(query)}&per_page=9&client_id=${UNSPLASH_ACCESS_KEY}`);
                        const data = await response.json();
                        if (data.results) {
                            searchCache.current[query] = data.results;
                            setUnsplashResults(data.results);
                        }
                    } catch (error) {
                        console.error("Error en búsqueda de Unsplash:", error);
                    }
                }, 300); // Reducido de 500ms a 300ms para mayor velocidad percibida

                return () => clearTimeout(timer);
            }, [searchQuery]);

            // Limpiar búsqueda al cerrar formulario
            useEffect(() => {
                // Reiniciar filtros al cambiar de pestaña para evitar confusión de contenido "oculto"
                setFilter('Todos');
                setSearchTerm('');
                setIsSearching(false);
            }, [view]);

            useEffect(() => {
                if (!formPlan) {
                    setSearchQuery('');
                    setUnsplashResults([]);
                }
            }, [formPlan]);

            useEffect(() => {
                setIsNavVisible(true);
                if (!selectedPlan && !formPlan && !completionPlan && mainRef.current) {
                    // Pequeño delay para asegurar que el scroll se estabilice tras cerrar el modal
                    const timer = setTimeout(() => {
                        if (mainRef.current) lastScrollTop.current = mainRef.current.scrollTop;
                    }, 100);
                    return () => clearTimeout(timer);
                }
            }, [view, selectedPlan, formPlan, completionPlan]);

            useEffect(() => {
                const initialLoadComplete = !authChecking && (!user || (user && !isLoadingData));
                if (initialLoadComplete && showLoadingOverlay && !isFadingOut) {
                    setIsFadingOut(true);
                }
            }, [authChecking, isLoadingData, user, showLoadingOverlay, isFadingOut]);

            useEffect(() => {
                if (isFadingOut) {
                    const timer = setTimeout(() => {
                        setShowLoadingOverlay(false);
                    }, 400);
                    return () => clearTimeout(timer);
                }
            }, [isFadingOut]);

            const CATEGORIES = ['Outdoor', 'Aventura', 'Gastronomía', 'Deportes', 'Otro'];
            const PRICES = ['Gratis', '$', '$$', '$$$'];

            const getFallbackImg = (category) => {
                const terms = { Outdoor: 'nature', Aventura: 'ocean', Gastronomía: 'restaurant', Deportes: 'fitness', Otro: 'travel' };
                return `https://images.unsplash.com/photo-1500333917452-fa330087ed89?auto=format&fit=crop&q=80&w=400&sig=${Math.random()}&${terms[category] || 'travel'}`;
            };

            const filteredPlans = useMemo(() => {
                // Filtramos los que NO están completados para el feed principal
                let base = plans.filter(p => !completedIds.includes(p.id));
                if (filter !== 'Todos') {
                    base = base.filter(p => p.category === filter);
                }
                if (searchTerm) {
                    const q = normalize(searchTerm);
                    base = base.filter(p => 
                        normalize(p.title).includes(q) || 
                        normalize(p.description).includes(q) || 
                        normalize(p.location).includes(q) || 
                        normalize(p.category).includes(q)
                    );
                }
                return base;
            }, [filter, plans, completedIds, searchTerm]);

            const isSaved = (id) => Array.isArray(savedIds) && savedIds.includes(id);

            // Componente de Corazón SVG para evitar conflictos con Lucide
            const HeartSVG = ({ filled, className }) => (
                <svg 
                    viewBox="0 0 24 24" fill={filled ? "currentColor" : "none"} 
                    stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" 
                    className={className}
                >
                    <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
                </svg>
            );

            const toggleSave = async (plan) => {
                const wasSaved = isSaved(plan.id);
                
                // 1. Actualización de UI Instantánea
                setPlans(prev => prev.map(p => p.id === plan.id ? { ...p, favorito: !wasSaved } : p));

                const { error } = await supabaseClient
                    .from('planes')
                    .update({ favorito: !wasSaved })
                    .eq('id', plan.id);

                if (error) {
                    setPlans(prev => prev.map(p => p.id === plan.id ? { ...p, favorito: wasSaved } : p));
                    setAuthMessage({ type: 'error', text: "Error al actualizar favorito" });
                } else {
                    setAuthMessage({ 
                        type: 'success', 
                        text: wasSaved ? "Eliminado de favoritos 💔" : "¡Marcado como favorito! ❤️" 
                    });
                }
            };

            const toggleComplete = async (plan) => {
                if (!plan.id) return;
                const wasCompleted = completedIds.includes(plan.id);
                
                if (!wasCompleted) {
                    setCompletionPlan(plan);
                    setRating(5); // Default
                    return;
                }

                // Si ya estaba completado, pedimos confirmación antes de borrar los datos asociados
                setPlanToUncomplete(plan);
                setShowUncompleteConfirm(true);
            };

            const confirmUncomplete = async () => {
                if (!planToUncomplete) return;
                const planId = planToUncomplete.id;

                // Actualización optimista
                setPlans(prev => prev.map(p => p.id === planId ? { ...p, completado: false, completedDate: null, rating: null, completionComment: null } : p));
                setShowUncompleteConfirm(false);

                const { error } = await supabaseClient
                    .from('planes')
                    .update({ completado: false, fecha_completado: null, puntuacion: null, comentario_completado: null })
                    .eq('id', planId);

                if (error) {
                    fetchPlans();
                    setAuthMessage({ type: 'error', text: "Error al desmarcar plancito" });
                } else {
                    setAuthMessage({ type: 'success', text: "Plancito devuelto al feed Explorar. 🌴" });
                    // Si el detalle estaba abierto, lo cerramos para refrescar la vista
                    if (selectedPlan && selectedPlan.id === planId) {
                        setSelectedPlan(null);
                    }
                }
                setPlanToUncomplete(null);
            };

            const submitCompletion = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const data = {
                    completado: true,
                    fecha_completado: formData.get('date'),
                    puntuacion: rating,
                    comentario_completado: formData.get('comment')
                };

                const { error } = await supabaseClient.from('planes').update(data).eq('id', completionPlan.id);
                
                if (error) {
                    setAuthMessage({ type: 'error', text: "Error al guardar tu experiencia" });
                } else {
                    setAuthMessage({ type: 'success', text: "¡Plancito completado! ✨" });
                    await fetchPlans();
                    setCompletionPlan(null);
                    setSelectedPlan(null);
                }
            };

            const optimizeImgUrl = (url) => {
                if (!url) return '';
                // Si es un link de Unsplash, forzamos parámetros de ligereza (500px de ancho, 60% calidad)
                if (url.includes('unsplash.com')) {
                    const baseUrl = url.split('?')[0];
                    return `${baseUrl}?auto=format&fit=crop&q=60&w=500`;
                }
                return url;
            };

            const savePlan = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const planData = Object.fromEntries(formData.entries());
                
                const formattedBudget = planData.budget ? planData.budget.replace(/\$?\s*(\d+)/g, '$$$1') : '';
                
                // LIMPIEZA PRO: Extrae el ID de Instagram (sea post o reel)
                let cleanInstaId = planData.instaId || null;
                if (cleanInstaId && cleanInstaId.includes('/')) {
                    const matches = cleanInstaId.match(/\/(?:p|reel)\/([a-zA-Z0-9-_]+)/);
                    if (matches) cleanInstaId = matches[1];
                    else cleanInstaId = cleanInstaId.split('/').filter(Boolean).pop();
                }

                const supabasePayload = {
                    nombre: planData.title,
                    descripción: planData.description,
                    ubicación: planData.location,
                    instagram: planData.instagram ? planData.instagram.replace('@', '') : '',
                    presupuesto: formattedBudget,
                    detalles: planData.logisticsDetail,
                    categoria: planData.category,
                    imagen_url: optimizeImgUrl(planData.imgUrl || formPlan.img || getFallbackImg(planData.category)),
                    logística: planData.logistics,
                    tips: planData.tips ? planData.tips.split(',').map(t => t.trim()).filter(Boolean) : [],
                    tiktok_id: cleanInstaId, // Mantenemos el nombre de la columna para no romper la DB
                    user_id: user.id
                };

                if (formPlan.id) {
                    await supabaseClient.from('planes').update(supabasePayload).eq('id', formPlan.id);
                    setAuthMessage({ type: 'success', text: "¡Plancito actualizado! 💾" });
                } else {
                    await supabaseClient.from('planes').insert([supabasePayload]);
                    setAuthMessage({ type: 'success', text: "¡Nuevo plancito creado! ✨" });
                }
                
                // Forzamos la actualización de la lista
                await fetchPlans();

                setFormPlan(null);
                setSelectedPlan(null);
            };

            const handleAuth = async (e) => {
                e.preventDefault();
                const { email, password } = Object.fromEntries(new FormData(e.target).entries());
                if (authMode === 'login') {
                    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
                    if (error) setAuthMessage({ type: 'error', text: "Error: Credenciales incorrectas" });
                } else {
                    const { error } = await supabaseClient.auth.signUp({ email, password });
                    if (error) setAuthMessage({ type: 'error', text: error.message });
                    else setAuthMessage({ type: 'success', text: "¡Cuenta creada! Revisa tu correo para confirmar." });
                }
            };

            const surpriseMe = () => {
                const randomPlan = plans[Math.floor(Math.random() * plans.length)];
                setSelectedPlan(randomPlan);
            };

            const deletePlan = async () => {
                if (!formPlan?.id) return;
                
                const { error } = await supabaseClient
                    .from('planes')
                    .delete()
                    .eq('id', formPlan.id)
                    .eq('user_id', user.id); // Seguridad extra: solo borrar si es mío

                if (error) {
                    setAuthMessage({ type: 'error', text: "Error al eliminar el plancito" });
                } else {
                    setAuthMessage({ type: 'success', text: "Plancito eliminado con éxito 🗑️" });
                    // Forzamos la actualización de la lista
                    await fetchPlans();
                    setFormPlan(null);
                    setSelectedPlan(null);
                    setShowDeleteConfirm(false);
                }
            };

            const seedDatabase = async () => {
                console.log("Buscando planes maestros (user_id IS NULL)...");
                const { data: templates, error: fetchError } = await supabaseClient
                    .from('planes')
                    .select('*')
                    .is('user_id', null);
                
                if (fetchError) {
                    console.error("Error al buscar plantillas:", fetchError);
                    return;
                }
                
                if (!templates || templates.length === 0) {
                    console.warn("No se encontraron planes maestros en la DB. Asegúrate de que user_id sea NULL.");
                    return;
                }

                console.log(`Clonando ${templates.length} planes maestros para el usuario ${user.id}...`);

                const newPlans = templates.map(({ id, created_at, ...rest }) => ({
                    ...rest,
                    user_id: user.id
                }));

                const { error: insertError } = await supabaseClient.from('planes').insert(newPlans);
                if (!insertError) {
                    console.log("¡Plancitos de prueba cargados con éxito!");
                    localStorage.setItem(`seeded_${user.id}`, 'true');
                    await fetchPlans();
                } else {
                    console.error("Error al insertar planes clonados:", insertError);
                }
            };

            const handleSetCity = (e) => {
                try {
                    e.preventDefault();
                    const formData = new FormData(e.target);
                    const cityValue = formData.get('city')?.toString().trim();
                    if (cityValue) {
                        localStorage.setItem('plancitos_city', cityValue);
                        setUserCity(cityValue);
                    }
                } catch (err) {
                    console.error("Error setting city:", err);
                }
            };

            // Lógica de arrastre (Drag to close) ultra-ligera
            const handleDragStart = (e) => {
                const el = e.currentTarget.closest('.drawer-content');
                if (!el) return;
                isDragging.current = true;
                dragStartY.current = e.pageY;
                el.style.transition = 'none';
                e.currentTarget.setPointerCapture(e.pointerId);
            };

            const handleDragMove = (e) => {
                if (!isDragging.current) return;
                const el = e.currentTarget.closest('.drawer-content');
                if (!el) return;
                const deltaY = Math.max(0, e.pageY - dragStartY.current);
                el.style.transform = `translateY(${deltaY}px)`;
            };

            const handleDragEnd = (e) => {
                if (!isDragging.current) return;
                isDragging.current = false;
                const el = e.currentTarget.closest('.drawer-content');
                if (!el) return;
                const deltaY = e.pageY - dragStartY.current;
                
                el.style.transition = 'transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1)';
                if (deltaY > 120) {
                    el.style.transform = 'translateY(100%)';
                    setTimeout(() => { setFormPlan(null); setSelectedPlan(null); }, 250);
                } else {
                    el.style.transform = 'translateY(0)';
                }
            };

            const handleScroll = (e) => {
                // Si hay un modal abierto, ignoramos el scroll para la navegación
                if (selectedPlan || formPlan || completionPlan) return;

                const currentScrollTop = e.currentTarget.scrollTop;
                const delta = currentScrollTop - lastScrollTop.current;

                // Umbral para ignorar micro-movimientos o rebotes de inercia (10px)
                if (Math.abs(delta) < 10) return;

                if (delta > 0 && currentScrollTop > 60) {
                    if (isNavVisible) setIsNavVisible(false);
                } else if (delta < 0 || currentScrollTop <= 60) {
                    if (!isNavVisible) setIsNavVisible(true);
                }
                lastScrollTop.current = currentScrollTop;
            };

            const renderContent = () => {
                if (authChecking) return null;
                if (!user) {
                    return (
                        <div className="max-w-md mx-auto min-h-screen flex items-center justify-center p-8 bg-white shadow-2xl animate-fade-in">
                        {authMessage && (
                            <div className={`fixed bottom-12 left-1/2 -translate-x-1/2 z-[200] w-[80%] max-w-[320px] px-6 py-4 rounded-3xl shadow-2xl flex items-center gap-3 transition-all border animate-in fade-in slide-in-from-bottom-4 duration-300 ${authMessage.type === 'error' ? 'bg-red-50 border-red-100 text-red-600' : 'bg-green-50 border-green-100 text-green-600'}`}>
                                <i data-lucide={authMessage.type === 'error' ? 'alert-circle' : 'check-circle'} className="w-5 h-5 flex-shrink-0"></i>
                                <p className="text-[11px] font-bold leading-tight">{authMessage.text}</p>
                            </div>
                        )}
                        <div className="w-full space-y-8">
                            <div className="text-center">
                                <h1 className="text-5xl font-black tracking-tighter text-slate-900 mb-2">Plancitos🌴</h1>
                                <p className="text-xl text-blue-500 font-serif-aesthetic italic">toda tu agenda en un solo lugar</p>
                            </div>
                            <form onSubmit={handleAuth} className="space-y-4 pt-8">
                                <div className="space-y-1">
                                    <label className="text-[10px] font-black uppercase text-slate-400 px-1">Email</label>
                                    <input name="email" type="email" required className="w-full bg-slate-50 border-none rounded-2xl p-4 text-sm outline-none focus:ring-2 ring-blue-500/10" placeholder="tu@correo.com" />
                                </div>
                                <div className="space-y-1">
                                    <label className="text-[10px] font-black uppercase text-slate-400 px-1">Contraseña</label>
                                    <input name="password" type="password" required className="w-full bg-slate-50 border-none rounded-2xl p-4 text-sm outline-none focus:ring-2 ring-blue-500/10" placeholder="••••••••" />
                                </div>
                                <button type="submit" className="w-full py-4 bg-slate-900 text-white rounded-2xl font-bold text-sm shadow-xl active:scale-95 transition-all mt-4">
                                    {authMode === 'login' ? 'Iniciar Sesión' : 'Registrarse'}
                                </button>
                            </form>
                            <div className="text-center">
                                <button onClick={() => setAuthMode(authMode === 'login' ? 'signup' : 'login')} className="text-xs text-slate-400 font-semibold hover:text-blue-500 transition-colors underline underline-offset-4">
                                    {authMode === 'login' ? '¿No tienes cuenta? Regístrate gratis' : '¿Ya tienes cuenta? Inicia sesión'}
                                </button>
                            </div>
                        </div>
                    </div>
                );
                }

                // Solo bloqueamos el renderizado si es la carga inicial (mientras el overlay está visible)
                if (isLoadingData && showLoadingOverlay) return null;

                return (
                <div className="max-w-md mx-auto h-screen flex flex-col relative bg-white shadow-2xl animate-fade-in overflow-hidden">
                    {/* Mensajes de feedback (Toasts) */}
                    {authMessage && (
                        <div className="fixed bottom-28 left-1/2 -translate-x-1/2 z-[200] w-[80%] max-w-[320px] px-6 py-4 rounded-3xl shadow-2xl flex items-center gap-3 bg-white/80 backdrop-blur-xl border border-slate-100 animate-in fade-in slide-in-from-bottom-4 duration-300">
                            <div className={`w-8 h-8 rounded-full flex items-center justify-center ${authMessage.type === 'error' ? 'bg-red-100 text-red-600' : 'bg-green-100 text-green-600'}`}>
                                <i data-lucide={authMessage.type === 'error' ? 'alert-circle' : 'check-circle'} className="w-4 h-4"></i>
                            </div>
                            <p className="text-[11px] font-bold text-slate-800 leading-tight">{authMessage.text}</p>
                        </div>
                    )}

                    {/* Header */}
                    <header className="p-7 flex-none glass border-b border-slate-50 z-50">
                        <div className="flex justify-between items-center mb-7">
                            <div>
                                <div className="flex items-center gap-2">
                                    <h1 className="text-4xl font-black tracking-tighter text-slate-900 leading-none">Plancitos</h1>
                                    <span className="text-3xl">🌴</span>
                                </div>
                                <p className="text-2xl text-blue-500 font-serif-aesthetic italic lowercase leading-none mt-1">{view === 'saved' ? 'mis favoritos' : 'para el fin'}</p>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => setView('saved')} className="relative p-2 bg-slate-50 rounded-full cursor-pointer active:scale-90 transition-all border-none outline-none">
                                    <HeartSVG filled={savedIds.length > 0} className={`w-5 h-5 ${savedIds.length > 0 ? 'text-red-500' : 'text-slate-400'}`} />
                                    {savedIds.length > 0 && (
                                        <span className="absolute -top-1 -right-1 bg-red-500 text-white text-[9px] w-4 h-4 rounded-full flex items-center justify-center font-bold">
                                            {savedIds.length}
                                        </span>
                                    )}
                                </button>
                                <div className="relative">
                                    <button onClick={() => setShowUserMenu(!showUserMenu)} className="relative p-2 bg-slate-50 rounded-full cursor-pointer active:scale-90 transition-all border-none outline-none text-slate-400">
                                        <i data-lucide="user" className="w-5 h-5 transition-colors"></i>
                                    </button>
                                    {showUserMenu && (
                                        <>
                                            <div className="fixed inset-0 z-[55]" onClick={() => setShowUserMenu(false)}></div>
                                            <div className="absolute right-0 mt-3 w-56 bg-white rounded-[24px] shadow-2xl border border-slate-50 p-5 z-[60] animate-in fade-in zoom-in-95 duration-200">
                                                <p className="text-[9px] font-black uppercase tracking-widest text-slate-400 mb-1">Tu Cuenta</p>
                                                <p className="text-xs font-bold text-slate-800 mb-4 truncate">{user.email}</p>
                                                <div className="h-px bg-slate-50 mb-4"></div>
                                                <button onClick={() => supabaseClient.auth.signOut()} className="flex items-center gap-2 text-red-500 text-xs font-bold hover:opacity-70 transition-opacity">
                                                    <i data-lucide="log-out" className="w-4 h-4"></i> Cerrar Sesión
                                                </button>
                                            </div>
                                        </>
                                    )}
                                </div>
                            </div>
                        </div>
                        
                        <div className="flex gap-4 overflow-x-auto no-scrollbar mb-2">
                            <button onClick={() => setView('explore')} className={`pb-2 text-sm font-semibold transition-all ${view === 'explore' ? 'border-b-2 border-blue-500 text-blue-600' : 'text-slate-400'}`}>Explorar</button>
                            <button onClick={() => setView('inspiration')} className={`pb-2 text-sm font-semibold transition-all ${view === 'inspiration' ? 'border-b-2 border-blue-500 text-blue-600' : 'text-slate-400'}`}>Inspiración</button>
                            <button onClick={() => setView('completed')} className={`pb-2 text-sm font-semibold transition-all ${view === 'completed' ? 'border-b-2 border-green-500 text-green-600' : 'text-slate-400'}`}>Completados</button>
                            {view === 'saved' && <button className="pb-2 text-sm font-semibold border-b-2 border-red-500 text-red-600">Favoritos</button>}
                        </div>

                        {(view === 'explore' || view === 'saved' || view === 'completed') && (
                            <div ref={searchRef} className="flex gap-2 items-center py-2">
                                <button 
                                    onClick={() => {
                                        setIsSearching(!isSearching);
                                        if (isSearching) setSearchTerm('');
                                    }} 
                                    className={`flex-none p-2.5 rounded-xl transition-all ${isSearching ? 'bg-slate-900 text-white shadow-lg' : 'bg-slate-100 text-slate-400'}`}
                                >
                                    <i data-lucide={isSearching ? "x" : "search"} className="w-4 h-4"></i>
                                </button>
                                
                                {isSearching ? (
                                    <input 
                                        autoFocus
                                        type="text"
                                        value={searchTerm}
                                        onChange={(e) => setSearchTerm(e.target.value)}
                                        placeholder="Buscar..."
                                        className="flex-1 bg-slate-100 border-none rounded-xl py-2 px-4 text-xs font-semibold outline-none focus:ring-2 ring-blue-500/20 animate-in slide-in-from-left-2 duration-200"
                                    />
                                ) : (
                                    <div className="flex gap-2 overflow-x-auto no-scrollbar">
                                        {['Todos', 'Outdoor', 'Aventura', 'Gastronomía', 'Deportes', 'Otro'].map(cat => (
                                            <button 
                                                key={cat}
                                                onClick={() => setFilter(cat)}
                                                className={`px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all ${filter === cat ? 'bg-slate-900 text-white shadow-lg shadow-slate-200' : 'bg-slate-100 text-slate-500'}`}
                                            >
                                                {cat}
                                            </button>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}
                    </header>

                <main ref={mainRef} onScroll={handleScroll} className="flex-1 overflow-y-auto no-scrollbar px-6 pt-4 pb-28">
                        {plans.length === 0 && view === 'explore' && !isLoadingData && (
                            <div className="flex flex-col items-center justify-center py-20 text-center">
                                <div className="bg-blue-50 p-6 rounded-[32px] mb-4">
                                    <i data-lucide="database" className="w-12 h-12 text-blue-500 opacity-50"></i>
                                </div>
                                <h3 className="font-bold text-slate-800 mb-2">¡No tienes plancitos!</h3>
                                <p className="text-xs text-slate-500 mb-6 px-10">Para ver algo, agrega un nuevo plan</p>
                                <button onClick={() => setFormPlan({})} className="bg-slate-900 text-white px-6 py-3 rounded-2xl text-xs font-bold shadow-lg active:scale-95 transition-all">Cargar nuevo plancito</button>
                            </div>
                        )}
                        {view === 'explore' || view === 'saved' || view === 'completed' ? (
                            <div className="grid grid-cols-1 gap-8">
                                {(view === 'explore' ? filteredPlans : view === 'saved' ? savedPlans : completedPlans).map(plan => (
                                    <div 
                                        key={plan.id} 
                                        onClick={() => setSelectedPlan(plan)}
                                        className="group rounded-[32px] overflow-hidden bg-white border border-slate-100 shadow-sm transition-all active:scale-[0.98] cursor-pointer"
                                    >
                                        <div className="relative h-56 overflow-hidden">
                                            <img src={plan.img} alt={plan.title} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" />
                                            <div className="absolute top-4 left-4 bg-white/80 backdrop-blur-md px-3 py-1.5 rounded-2xl text-[10px] font-bold text-slate-800 shadow-sm uppercase tracking-tight">
                                                {plan.category}
                                            </div>
                                        </div>
                                        <div className="p-5">
                                            <div className="flex justify-between items-start mb-3">
                                                <h3 className="font-bold text-xl text-slate-800 tracking-tight">{plan.title}</h3>
                                                <span className="bg-blue-50 text-blue-600 px-2 py-1 rounded-lg font-bold text-xs">{plan.price}</span>
                                            </div>
                                    <div className="flex flex-col gap-2 text-slate-500 text-xs mb-4">
                                                <div className="flex items-center gap-2"><i data-lucide="map-pin" className="w-3.5 h-3.5 text-blue-400"></i> {plan.location}</div>
                                                <div className="flex items-center gap-2"><i data-lucide="dollar-sign" className="w-3.5 h-3.5 text-green-400"></i> Presupuesto: {plan.budget}</div>
                                                {plan.instagram && (
                                                    <div className="flex items-center gap-2"><i data-lucide="at-sign" className="w-3.5 h-3.5 text-pink-400"></i> @{plan.instagram}</div>
                                                )}
                                            </div>
                                            {view === 'completed' && (
                                                <div className="mt-2 pt-4 border-t border-slate-50 flex justify-between items-center">
                                                    <div className="flex gap-0.5">
                                                        {[...Array(5)].map((_, i) => (
                                                            <i 
                                                                key={i} 
                                                                data-lucide="star" 
                                                                className={`w-3 h-3 ${i < plan.rating ? 'text-yellow-400 fill-yellow-400' : 'text-slate-200'}`}
                                                            ></i>
                                                        ))}
                                                    </div>
                                                    <span className="text-[10px] font-bold text-slate-400">
                                                        {plan.completedDate ? new Date(plan.completedDate).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }) : ''}
                                                    </span>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                ))}
                                {view === 'saved' && savedPlans.length === 0 && (
                                    <div className="flex flex-col items-center justify-center py-20 text-slate-400 text-center">
                                        <i data-lucide="heart" className="w-12 h-12 mb-4 opacity-20"></i>
                                        <p className="text-sm font-medium">No tienes favoritos aún.</p>
                                        <button onClick={() => setView('explore')} className="mt-4 text-blue-500 text-xs font-bold underline">Explorar planes</button>
                                    </div>
                                )}
                                {view === 'completed' && completedPlans.length === 0 && (
                                    <div className="flex flex-col items-center justify-center py-20 text-slate-400 text-center">
                                        <i data-lucide="check-circle" className="w-12 h-12 mb-4 opacity-20 text-green-500"></i>
                                        <p className="text-sm font-medium">Aún no has completado ningún plancito.</p>
                                        <button onClick={() => setView('explore')} className="mt-4 text-green-600 text-xs font-bold underline">¡A por el primero!</button>
                                    </div>
                                )}
                            </div>
                        ) : !userCity ? (
                            /* Pantalla de configuración de ciudad */
                            <div key="setup-city-view" className="flex flex-col items-center justify-center py-12 px-4 text-center animate-fade-in">
                                <div className="w-20 h-20 bg-blue-50 rounded-[32px] flex items-center justify-center mb-8 rotate-3 shadow-inner">
                                    <i data-lucide="map-pin" className="w-10 h-10 text-blue-500"></i>
                                </div>
                                <h2 className="text-3xl font-black text-slate-900 tracking-tighter mb-4 leading-tight">¿Dónde estamos hoy?</h2>
                                <p className="text-sm text-slate-500 mb-10 px-6 font-medium">Personalizaremos tu feed de inspiración con los mejores planes de tu ciudad.</p>
                                
                                <form onSubmit={handleSetCity} className="w-full space-y-4">
                                    <input 
                                        name="city" 
                                        required 
                                        autoComplete="off"
                                        className="w-full bg-slate-50 border-2 border-slate-100 rounded-[24px] p-5 text-center font-bold text-slate-800 outline-none focus:border-blue-500/20 focus:ring-4 ring-blue-500/5 transition-all" 
                                        placeholder="Escribe tu ciudad (ej: Caracas)" 
                                    />
                                    <button type="submit" className="w-full py-5 bg-slate-900 text-white rounded-[24px] font-black text-xs shadow-xl active:scale-95 transition-all uppercase tracking-widest">
                                        Descubrir planes
                                    </button>
                                </form>
                            </div>
                        ) : (
                            /* Pantalla de Canales de Inspiración */
                            <div key={`inspiration-view-${userCity}`} className="space-y-6 animate-fade-in pb-24">
                                <div className="flex items-center justify-between bg-slate-50/50 p-6 rounded-[32px] border border-slate-100">
                                    <div>
                                        <p className="text-[10px] font-black uppercase tracking-widest text-slate-400">Inspiración en</p>
                                        <h2 className="text-2xl font-black text-slate-900 tracking-tighter">{userCity}</h2>
                                    </div>
                                    <button onClick={() => setUserCity('')} className="p-4 bg-white rounded-2xl shadow-sm text-slate-400 active:scale-90 transition-all">
                                        <i data-lucide="settings-2" className="w-5 h-5"></i>
                                    </button>
                                </div>

                                <div className="grid gap-4">
                                    {inspirationChannels.map((channel, idx) => (
                                        <div key={idx} className="bg-white border border-slate-100 p-6 rounded-[36px] shadow-sm hover:shadow-md transition-shadow">
                                            <div className="flex items-center gap-4 mb-6">
                                                <div className="w-12 h-12 bg-blue-50 rounded-2xl flex items-center justify-center">
                                                    <i data-lucide={channel.icon} className="w-6 h-6 text-blue-500"></i>
                                                </div>
                                                <div>
                                                    <h3 className="font-bold text-slate-800 leading-none mb-1">{channel.title}</h3>
                                                    <p className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">#{channel.tag}</p>
                                                </div>
                                            </div>
                                            
                                            <div className="grid grid-cols-2 gap-3">
                                                <a 
                                                    href={`https://www.instagram.com/explore/tags/${channel.tag}/`} 
                                                    target="_blank"
                                                    className="flex items-center justify-center gap-2 py-4 bg-gradient-to-tr from-yellow-400 via-red-500 to-purple-600 text-white rounded-2xl text-[10px] font-black uppercase tracking-widest shadow-lg shadow-red-100 active:scale-95 transition-all"
                                                >
                                                    <i data-lucide="instagram" className="w-4 h-4"></i> Instagram
                                                </a>
                                                <a 
                                                    href={`https://www.tiktok.com/tag/${channel.tag}`} 
                                                    target="_blank"
                                                    className="flex items-center justify-center gap-2 py-4 bg-black text-white rounded-2xl text-[10px] font-black uppercase tracking-widest shadow-lg shadow-slate-200 active:scale-95 transition-all"
                                                >
                                                    <i data-lucide="play" className="w-4 h-4"></i> TikTok
                                                </a>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                
                                <div className="p-8 text-center">
                                    <p className="text-[10px] font-bold text-slate-300 italic">Los links abren directamente las apps nativas para una mejor experiencia.</p>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Modal Formulario (Nuevo / Editar) */}
                    {formPlan && (
                        <div className="fixed inset-0 z-[110] flex items-end justify-center">
                            <div className="modal-overlay absolute inset-0" onClick={() => setFormPlan(null)}></div>
                            <form 
                                onSubmit={savePlan} 
                                className="drawer-content relative w-full max-w-md bg-white rounded-t-[40px] p-8 pb-12 shadow-2xl max-h-[95vh] overflow-y-auto"
                            >
                                {/* Drag Handle Zone */}
                                <div 
                                    onPointerDown={handleDragStart}
                                    onPointerMove={handleDragMove}
                                    onPointerUp={handleDragEnd}
                                    className="w-full h-8 absolute top-0 left-0 flex items-center justify-center cursor-grab active:cursor-grabbing touch-none z-50"
                                >
                                    <div className="w-12 h-1.5 bg-slate-200 rounded-full mt-2"></div>
                                </div>
                                <button type="button" onClick={() => setFormPlan(null)} className="absolute top-6 right-6 p-2 text-slate-300 hover:text-slate-500 active:scale-90 transition-all">
                                    <i data-lucide="x" className="w-6 h-6"></i>
                                </button>
                                <h2 className="text-2xl font-bold mb-6 text-slate-900">{formPlan.id ? 'Editar Plan' : 'Nuevo Plancito'}</h2>
                                
                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">Título del Plan</label>
                                        <input name="title" defaultValue={formPlan.title} required className="w-full bg-slate-50 border-none rounded-xl p-3 text-sm" placeholder="Ej: Picnic en la playa" />
                                    </div>
                                    
                                    <div>
                                        <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">Imagen del Plancito</label>
                                        <div className="space-y-3">
                                            <div className="relative">
                                                <input 
                                                    value={searchQuery}
                                                    onChange={(e) => setSearchQuery(e.target.value)}
                                                    className="w-full bg-slate-100 border-none rounded-xl p-3 text-xs focus:ring-2 ring-blue-500/20 outline-none pr-10" 
                                                    placeholder="Busca una foto (ej: playa, sushi...)" 
                                                />
                                                <i data-lucide="search" className="w-4 h-4 text-slate-400 absolute right-3 top-3"></i>
                                            </div>
                                            
                                            {unsplashResults.length > 0 && (
                                                <div className="grid grid-cols-3 gap-2 animate-in fade-in slide-in-from-top-2 duration-300">
                                                    {unsplashResults.map(photo => (
                                                        <div 
                                                            key={photo.id}
                                                            onClick={() => setFormPlan({...formPlan, img: photo.urls.regular})}
                                                            className={`relative aspect-square rounded-lg overflow-hidden cursor-pointer transition-all ${formPlan.img === photo.urls.regular ? 'ring-4 ring-blue-500 ring-offset-2' : 'hover:opacity-80'}`}
                                                        >
                                                            <img src={photo.urls.thumb} className="w-full h-full object-cover" loading="eager" decoding="async" />
                                                            {formPlan.img === photo.urls.regular && (
                                                                <div className="absolute inset-0 bg-blue-500/20 flex items-center justify-center">
                                                                    <i data-lucide="check" className="w-6 h-6 text-white drop-shadow-md"></i>
                                                                </div>
                                                            )}
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                            <input name="imgUrl" type="hidden" value={formPlan.img || ''} />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">Usuario Instagram (sin @)</label>
                                        <div className="flex items-center gap-2 bg-slate-50 rounded-xl px-4 border border-transparent focus-within:border-pink-100 transition-all">
                                            <i data-lucide="at-sign" className="w-4 h-4 text-pink-500"></i>
                                            <input name="instagram" defaultValue={formPlan.instagram} className="w-full bg-transparent border-none py-3 text-sm focus:ring-0 outline-none" placeholder="Ej: lecheria" />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">Categoría</label>
                                            <select name="category" defaultValue={formPlan.category || 'Outdoor'} className="w-full bg-slate-50 border-none rounded-xl p-3 text-sm">
                                                {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">Precio</label>
                                            <select name="price" defaultValue={formPlan.price || 'Gratis'} className="w-full bg-slate-50 border-none rounded-xl p-3 text-sm">
                                                {PRICES.map(p => <option key={p} value={p}>{p}</option>)}
                                            </select>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">Ubicación</label>
                                        <input name="location" defaultValue={formPlan.location} required className="w-full bg-slate-50 border-none rounded-xl p-3 text-sm" placeholder="Nombre del sitio" />
                                    </div>

                                    <div>
                                        <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">Descripción</label>
                                        <textarea name="description" defaultValue={formPlan.description} className="w-full bg-slate-50 border-none rounded-xl p-3 text-sm h-20" placeholder="¿De qué trata?"></textarea>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">Logística corta</label>
                                            <input name="logistics" defaultValue={formPlan.logistics} className="w-full bg-slate-50 border-none rounded-xl p-3 text-sm" placeholder="Ej: Fácil acceso" />
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">Presupuesto</label>
                                            <input name="budget" defaultValue={formPlan.budget} className="w-full bg-slate-50 border-none rounded-xl p-3 text-sm" placeholder="Ej: 10 - 20" />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">Logística Detallada</label>
                                        <textarea name="logisticsDetail" defaultValue={formPlan.logisticsDetail} className="w-full bg-slate-50 border-none rounded-xl p-3 text-sm h-16" placeholder="¿Cómo se llega exactamente?"></textarea>
                                    </div>

                                    <div>
                                        <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">Desglose de Presupuesto</label>
                                        <input name="budgetDetail" defaultValue={formPlan.budgetDetail} className="w-full bg-slate-50 border-none rounded-xl p-3 text-sm" placeholder="Ej: Entrada $5, Comida $10" />
                                    </div>

                                    <div>
                                        <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">Tips Pro (separados por coma)</label>
                                        <input name="tips" defaultValue={formPlan.tips?.join(', ')} className="w-full bg-slate-50 border-none rounded-xl p-3 text-sm" placeholder="Tip 1, Tip 2, Tip 3" />
                                    </div>

                                    <div>
                                        <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">Link o ID de Instagram Post</label>
                                        <input name="instaId" defaultValue={formPlan.tiktokId} className="w-full bg-slate-50 border-none rounded-xl p-3 text-sm" placeholder="Ej: C1a2b3c4d5e o link completo" />
                                    </div>
                                </div>

                                <div className="flex gap-4 mt-8">
                                    {formPlan.id && (
                                        <button 
                                            type="button" 
                                            onClick={() => setShowDeleteConfirm(true)} 
                                            className="flex-1 py-4 bg-red-50 text-red-600 rounded-2xl font-bold text-sm active:scale-95 transition-all flex items-center justify-center gap-2"
                                        >
                                            <i data-lucide="trash-2" className="w-4 h-4"></i> Eliminar
                                        </button>
                                    )}
                                    <button type="submit" className={`${formPlan.id ? 'flex-[2]' : 'w-full'} py-4 bg-blue-600 text-white rounded-2xl font-bold text-sm shadow-lg shadow-blue-100`}>
                                        {formPlan.id ? 'Guardar Cambios' : 'Guardar Plancito'}
                                    </button>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* Modal Formulario de Completado */}
                    {completionPlan && (
                        <div className="fixed inset-0 z-[120] flex items-end justify-center">
                            <div className="modal-overlay absolute inset-0" onClick={() => setCompletionPlan(null)}></div>
                            <form onSubmit={submitCompletion} className="drawer-content relative w-full max-w-md bg-white rounded-t-[40px] p-6 pb-10 shadow-2xl animate-in slide-in-from-bottom-full duration-300 max-h-[90vh] overflow-y-auto">
                                <div className="text-center mb-6">
                                    <div className="w-12 h-12 bg-green-50 rounded-full flex items-center justify-center mx-auto mb-3">
                                        <i data-lucide="sparkles" className="w-6 h-6 text-green-500"></i>
                                    </div>
                                    <h2 className="text-xl font-black text-slate-900 tracking-tighter">¡Qué buen plan!</h2>
                                    <p className="text-[11px] text-slate-500 font-medium">Cuéntanos qué tal te pareció</p>
                                </div>

                                <div className="space-y-4">
                                    <div className="text-center">
                                        <label className="block text-[10px] font-black uppercase text-slate-400 mb-2 tracking-widest">¿Cómo lo puntúas?</label>
                                        <div className="flex justify-center gap-3" onMouseLeave={() => setHoverRating(0)}>
                                            {[1, 2, 3, 4, 5].map((star) => (
                                                <button 
                                                    key={star} 
                                                    type="button" 
                                                    onMouseEnter={() => setHoverRating(star)}
                                                    onClick={() => setRating(star)}
                                                    className={`transition-all duration-300 transform ${(hoverRating || rating) >= star ? 'text-yellow-400 scale-125 rotate-12' : 'text-slate-200 scale-100'} hover:scale-150 active:scale-90`}
                                                >
                                                    <svg viewBox="0 0 24 24" className="w-8 h-8 fill-current stroke-current stroke-2 drop-shadow-sm"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">¿Qué día fuiste?</label>
                                        <input type="date" name="date" required defaultValue={new Date().toISOString().split('T')[0]} className="w-full bg-slate-50 border-none rounded-xl p-3 text-sm font-bold text-slate-800 outline-none" />
                                    </div>

                                    <div>
                                        <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">Un breve comentario</label>
                                        <textarea name="comment" className="w-full bg-slate-50 border-none rounded-xl p-3 text-sm h-20 outline-none placeholder:text-slate-300" placeholder="Ej: La comida estuvo increíble..."></textarea>
                                    </div>
                                </div>

                                <button type="submit" className="w-full mt-6 py-4 bg-slate-900 text-white rounded-[20px] font-black text-xs shadow-xl active:scale-95 transition-all uppercase tracking-widest">Guardar experiencia</button>
                            </form>
                        </div>
                    )}

                    {/* Popup Confirmación Desmarcar Completado */}
                    {showUncompleteConfirm && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center p-6">
                            <div className="modal-overlay absolute inset-0" onClick={() => setShowUncompleteConfirm(false)}></div>
                            <div className="bg-white rounded-[32px] p-8 w-full max-w-[320px] relative z-10 shadow-2xl animate-in zoom-in-95 duration-200 text-center">
                                <div className="bg-orange-50 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-6">
                                    <i data-lucide="alert-triangle" className="w-8 h-8 text-orange-500"></i>
                                </div>
                                <h3 className="text-xl font-bold text-slate-900 mb-2 tracking-tight">¿Desmarcar plan?</h3>
                                <p className="text-[11px] text-slate-500 mb-8 leading-relaxed px-4">Se borrará toda la información asociada al plan (puntuación, fecha y comentarios) y se devolverá al feed Explorar.</p>
                                <div className="flex flex-col gap-3">
                                    <button onClick={confirmUncomplete} className="w-full py-4 bg-orange-500 text-white rounded-2xl font-bold text-sm shadow-lg shadow-orange-100 active:scale-95 transition-all">Sí, desmarcar</button>
                                    <button onClick={() => setShowUncompleteConfirm(false)} className="w-full py-4 bg-slate-50 text-slate-500 rounded-2xl font-bold text-sm active:scale-95 transition-all">Cancelar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal Detalle Plan */}
                    {selectedPlan && (
                        <div className="fixed inset-0 z-[100] flex items-end justify-center">
                            <div className="modal-overlay absolute inset-0" onClick={() => setSelectedPlan(null)}></div>
                            <div 
                                className="drawer-content relative w-full max-w-md bg-white rounded-t-[40px] shadow-2xl max-h-[85vh] overflow-y-auto no-scrollbar"
                            >
                                {/* Hero Image Section */}
                                <div className="relative h-72 w-full flex items-end">
                                    <img src={selectedPlan.img} className="absolute inset-0 w-full h-full object-cover" />
                                    <div className="absolute inset-0 bg-gradient-to-t from-white via-white/95 via-35% to-transparent"></div>
                                    {/* Drag Handle Zone */}
                                    <div 
                                        onPointerDown={handleDragStart}
                                        onPointerMove={handleDragMove}
                                        onPointerUp={handleDragEnd}
                                        className="w-full h-12 absolute top-0 left-0 flex items-center justify-center cursor-grab active:cursor-grabbing touch-none z-50"
                                    >
                                        <div className="w-12 h-1.5 bg-white/60 backdrop-blur rounded-full mt-2"></div>
                                    </div>
                                    
                                    <button onClick={() => setSelectedPlan(null)} className="absolute top-10 left-6 p-2 text-white/70 hover:text-white active:scale-90 transition-all z-30">
                                        <i data-lucide="x" className="w-6 h-6"></i>
                                    </button>

                                    <div className="absolute top-10 right-6 flex gap-2">
                                        <button onClick={() => setFormPlan(selectedPlan)} className="p-3 bg-white/20 backdrop-blur-xl border border-white/30 rounded-2xl text-white shadow-xl active:scale-90 transition-all">
                                            <i key="btn-edit" data-lucide="pencil" className="w-5 h-5 drop-shadow-md"></i>
                                        </button>
                                        <button onClick={() => toggleSave(selectedPlan)} className="p-3 bg-white/20 backdrop-blur-xl border border-white/30 rounded-2xl shadow-xl active:scale-90 transition-all">
                                            <HeartSVG filled={isSaved(selectedPlan.id)} className={`w-6 h-6 ${isSaved(selectedPlan.id) ? 'text-red-500' : 'text-white drop-shadow-md'}`} />
                                        </button>
                                        <button onClick={() => toggleComplete(selectedPlan)} className="p-3 bg-white/20 backdrop-blur-xl border border-white/30 rounded-2xl shadow-xl active:scale-90 transition-all">
                                            <i data-lucide="check-circle" className={`w-6 h-6 transition-colors ${completedIds.includes(selectedPlan.id) ? 'text-green-500' : 'text-white drop-shadow-md'}`}></i>
                                        </button>
